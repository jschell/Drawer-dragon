name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The browser tests run one at a time in CI (see playwright.config.ts): about 20–25
    # minutes, plus room for a retry.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - name: Browser tests (iPhone SE, iPad, desktop Safari & Chrome)
        run: npx playwright test --trace off
