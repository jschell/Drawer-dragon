name: CI

# Runs on pull requests and on main. (Branch pushes used to start a second,
# identical run next to the pull request's run.)
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # One job per device setup, all at the same time, each on its own machine. Each
  # job still runs one browser at a time (see playwright.config.ts): CI machines
  # have no GPU, and two browsers on one machine starved each other.
  browser:
    name: Browser (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: iphone-se-webkit
            browser: webkit
          - project: ipad-webkit
            browser: webkit
          - project: desktop-safari
            browser: webkit
          - project: desktop-chrome
            browser: chromium
          - project: iphone-se-chromium
            browser: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Browsers are cached between runs; the system packages they need are always installed.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      # Chrome: the runner image already has Chrome's system libraries (Google Chrome is
      # preinstalled), so only the browser is fetched, from Playwright's own server.
      # WebKit: also needs system packages from the Ubuntu mirror. That mirror is
      # sometimes very slow (about 70 s per 5 MB once), so those ~22 MB are installed
      # only for the WebKit jobs. No retry loop: a stopped attempt left apt-get running
      # and holding the package lock, so retries could only fail.
      - name: Install ${{ matrix.browser }}
        timeout-minutes: 10
        run: |
          if [ "${{ matrix.browser }}" = "webkit" ]; then
            npx playwright install --with-deps webkit
          else
            npx playwright install chromium
          fi
      - name: Browser tests (${{ matrix.project }})
        run: npx playwright test --project=${{ matrix.project }} --trace off
