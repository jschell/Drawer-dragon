name: Deploy to GitHub Pages

# Publishes the prototype so it can be opened on an iPad or iPhone.
# One-time setup:
#   1. Settings → Pages → Source: "GitHub Actions".
#   2. Settings → Environments → github-pages → Deployment branches: allow `main`.
#      (Otherwise the job is rejected with "Branch main is not allowed to deploy
#      to github-pages due to environment protection rules" and writes no logs.)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build and upload in one job, deploy in the next. When both ran in a single
  # job, deploy-pages sometimes asked for the upload a fraction of a second
  # after it finished and got "Found 0 artifact(s)" (runs #5 and #6).
  # A separate job only starts once the upload is complete and listed.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
